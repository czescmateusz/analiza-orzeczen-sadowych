[project]
name = "orzeczenia"
version = "0.1.0"
description = "Analiza orzeczeń sądów powszechnych w sprawach o zadośćuczynienie po wypadkach drogowych"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "huggingface_hub>=1.0",
    "pydantic>=2.7",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "quickjs>=1.19", "openpyxl>=3.1"]          # quickjs runs the app's JavaScript in tests (no Node needed)
analysis = ["numpy>=2", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14"]   # orzeczenia model

[project.scripts]
orzeczenia = "orzeczenia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
